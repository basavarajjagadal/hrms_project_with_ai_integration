{% extends 'base.html' %}

{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'employees/edit_profile.css' %}">
{% endblock %}

{% block content %}
<h2>Edit Profile</h2>
<form method="post">
    {% csrf_token %}

    <label >First Name</label>
    <input type="text" name="first_name" value="{{user.first_name}}">
    <br><br>

    <label >Last Name</label>
    <input type="text" name="first_name" value="{{user.last_name}}">
    <br><br>

    <label >Email Name</label>
    <input type="text" name="first_name" value="{{user.email}}">
    <br><br>

    <p><b>Note:</b>You can only edit your personal information here. Employment details are managed by HR.</p>
    <button type="submit">Save Changes</button>
    
    {% url "employee_profile" as employee_profile %}
    <button class="cancelbtn" type="button" onclick="window.location.href='{{employee_profile}}'">Cancel</button>


</form>
{% endblock %}
