{% extends 'base.html' %}
{% block content %}
<h2>Edit Employee</h2>
<form method="post">
    {% csrf_token %}

    <label for="department">Department</label>
    <input type="text" name="department" id="department" value="{{employee.department}}">
    <br><br>

    <label for="designation">Designation</label>
    <input type="text" name="designation" id="designation" value="{{employee.designation}}">
    <br><br>

    <label for="joining_date">Joining date</label>
    <input type="date" name="joining_date" id="joining_date" value="{{employee.joining_date | date:'Y-m-d'}}" >
    <br><br>
    
    <button type="submit">Edit</button>
</form>
{% endblock %}
