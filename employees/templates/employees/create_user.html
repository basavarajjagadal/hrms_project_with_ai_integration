{% extends 'base.html' %}

{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'employees/create_user.css' %}">
{% endblock %}

{% block content %}
<h2>create employee account</h2>
<form method="post">
    {% csrf_token %}
    <fieldset>
    <legend><b>Login Credential</b></legend>

    <label for="username">Username</label>
    <input type="text" name="username"  id="username" required>
    <br>

    <label>Email</label>
    <input type="email" name="email" required>
    <br>

    <label for="password">Password</label>
    <input type="text" name="password" id="password" required>
    <br>

    </fieldset>
    

    <br>
    <fieldset>
    <legend><b>Employee Details</b></legend>

    <label for="empid">Employee Id</label>
    <input type="text" name="employee_id" id="empid" required>
    <br>

    <label for="dept">Department</label>
    <input type="text" name="department" id="dept" required>
    <br>

    <label for="designation">Designation</label>
    <input type="text" name="designation" id="designation" required>
    <br>

    <label for="joining_date">joining_date</label>
    <input type="date" name="joining_date" id="joining_date" required>
    <br>
    </fieldset>
    <br>

    <button type="submit">Create Employee</button>

</form>

{% endblock %}
