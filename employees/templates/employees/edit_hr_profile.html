{% extends 'base.html' %}

{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'employees/edit_hr_profile.css' %}">
{% endblock  %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <h2>Edit Profile</h2>

<label for="firstname">First Name</label>
<input type="text" name="first_name" id="firstname" value="{{user.first_name}}">
<br><br>

<label for="lastname">Last Name</label>
<input type="text" name="last_name" id="lastname" value="{{user.last_name}}">
<br><br>

<label for="email">Email</label>
<input type="email" name="email" id="email" value="{{user.email}}">
<br><br>

{% url 'hr_dashboard' as hr_dashboard_url %}
<button class="btn" type="button" onclick="window.location.href='{{ hr_dashboard_url }}'">
  Cancel
</button>

<button class="btn" type="submit">Save</button>

</form>

{% endblock %}
