{% extends 'base.html' %}
{% block content %}
<h2>All Leave Request</h2>
<table border="1">

<tr>
<th>Employee</th>
<th>Start Date</th>
<th>End Date</th>
<th>Reason</th>
<th>Status</th>   
</tr>
{% for leave in leaves %}
<tr>
<td>{{ leave.employee.user.username  }}</td>
<td>{{ leave.start_date }}</td>
<td>{{ leave.end_date }}</td>
<td>{{ leave.reason }}</td>
<td>{{ leave.status }}</td>
</tr>
{% endfor %}
</table>
{% endblock %}
